<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }
  #bg-layer { position: fixed; inset: 0; z-index: 0; {{BG_CSS}} }
  #stage { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; overflow: hidden; }
  #img {
    max-width: 92%;
    max-height: 92%;
    object-fit: contain;
    filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.35));
    user-select: none;
  }
</style>
</head>
<body>
<div id="bg-layer"></div>
<div id="stage"><img id="img" src="{{IMAGE}}" draggable="false" /></div>
<script>
// 与 StaticPreview.vue 的布局一致：图片 contain + translate(画布宽/高百分比) + scale(百分比)
var SCALE = {{SCALE}};
var OFFSET_X = {{OFFSET_X}};
var OFFSET_Y = {{OFFSET_Y}};
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function applyLayout() {
  var img = document.getElementById('img');
  img.style.transform = 'translate(' + (clamp(OFFSET_X, -100, 100) / 100 * window.innerWidth) + 'px,' +
    (clamp(OFFSET_Y, -100, 100) / 100 * window.innerHeight) + 'px) scale(' + clamp(SCALE, 20, 300) / 100 + ')';
}
window.addEventListener('resize', applyLayout);
var _initialPropsApplied = false;
window.wallpaperPropertyListener = {
  applyUserProperties: function (properties) {
    try {
      // 首次全量推送以导出值为准，忽略（避免 WE 历史覆盖值污染布局）
      if (!_initialPropsApplied) {
        _initialPropsApplied = true;
        return;
      }
      if (properties.scalectrl) SCALE = properties.scalectrl.value;
      if (properties.offsetx) OFFSET_X = properties.offsetx.value;
      if (properties.offsety) OFFSET_Y = properties.offsety.value;
      applyLayout();
    } catch (e) {}
  }
};
applyLayout();
</script>
</body>
</html>
